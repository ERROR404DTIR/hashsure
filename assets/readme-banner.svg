<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Hashsure</title><desc id="d">A file fingerprint is generated and verified against a known checksum.</desc><defs><linearGradient id="bg"><stop stop-color="#18273e"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#142b43" stroke="#62e3c1" stroke-width="3"><rect x="110" y="85" width="210" height="135" rx="12"/><rect x="780" y="85" width="300" height="135" rx="12"/></g><g fill="#edf3ff" font-family="monospace" font-size="15"><text x="145" y="140">FILE</text><text x="145" y="180">INPUT</text><text x="815" y="140">SHA-256</text><text x="815" y="180">VERIFIED</text></g><path d="M320 152H780" stroke="#8fa8ff" stroke-width="4" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-88" dur="2.5s" repeatCount="indefinite"/></path><circle cx="550" cy="152" r="38" fill="#102a3b" stroke="#62e3c1" stroke-width="3"><animate attributeName="r" values="32;42;32" dur="2s" repeatCount="indefinite"/></circle><path d="M532 152L545 165L570 137" fill="none" stroke="#62e3c1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">HASHSURE</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">HASH / COMPARE / VERIFY</text></svg>